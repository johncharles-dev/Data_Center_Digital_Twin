# Mosquitto configuration for the data-center digital twin.
#
# Three listeners, one auth/ACL policy across all of them:
#
#   1883  plain MQTT   — published to 127.0.0.1 only (see docker-compose.yml);
#                        still requires a username/password, it is not open
#                        just because it is local.
#   8883  MQTT + TLS   — server cert from mosquitto/make_credentials.sh.
#   9001  WebSockets   — plaintext ON PURPOSE. Tailscale Funnel terminates TLS
#                        in front of it (serve_demo.sh) and proxies to
#                        localhost, so the browser still speaks wss://. Adding
#                        TLS here as well would mean double-terminating.
#
# The password file and ACL below are global, so they apply to every listener.
# per_listener_settings is deliberately NOT set: it defaults to false (global),
# it is deprecated in 2.x, and a per-listener policy is exactly how an
# "internal only" port ends up anonymous by accident.

# No unauthenticated client, on any listener, ever.
allow_anonymous false

password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

listener 9001
protocol websockets

# Log to stdout only. The container's stdout is what `docker logs dcdt-broker`
# reads, which is where tests/test_broker_security.py captures the "Denied
# PUBLISH" lines from. Writing to a bind-mounted file instead would need the
# host directory to be writable by uid 1883 (the mosquitto user inside the
# image), which is a permissions problem with no upside here.
log_dest stdout
log_type all
connection_messages true

# Retained LWT "offline" messages are how a subscriber tells "the twin died"
# apart from "the twin has nothing new to say" — keep queued messages for
# disconnected sessions bounded so a dead subscriber cannot grow the broker
# without limit.
max_queued_messages 1000
